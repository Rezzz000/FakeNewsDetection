version: "3.8"

services:
  api:
    build: .
    container_name: fake-news-detector
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
    volumes:
      - ./True.csv:/app/True.csv
      - ./Fake.csv:/app/Fake.csv
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
